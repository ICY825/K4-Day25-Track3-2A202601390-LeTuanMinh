# Same workload as default.yaml but backed by the shared Redis cache.
# Run:  python scripts/run_chaos.py --config configs/redis.yaml --out reports/metrics_redis.json
providers:
  - name: primary
    fail_rate: 0.25
    base_latency_ms: 180
    cost_per_1k_tokens: 0.01
  - name: backup
    fail_rate: 0.05
    base_latency_ms: 260
    cost_per_1k_tokens: 0.006
circuit_breaker:
  failure_threshold: 3
  reset_timeout_seconds: 2
  success_threshold: 1
cache:
  enabled: true
  backend: redis           # shared cache across gateway instances (requires docker compose up -d)
  ttl_seconds: 300
  similarity_threshold: 0.92
  redis_url: "redis://localhost:6379/0"
load_test:
  requests: 100

# Chaos scenarios: each overrides provider fail_rate for targeted testing.
# cache_enabled overrides the global cache setting for that scenario only.
scenarios:
  - name: primary_timeout_100
    description: "Primary provider fails 100% — all traffic should fallback"
    provider_overrides:
      primary: 1.0
  - name: primary_flaky_50
    description: "Primary provider fails 50% — circuit should oscillate"
    provider_overrides:
      primary: 0.5
  - name: all_healthy
    description: "Baseline — both providers forced healthy, no circuit should open"
    provider_overrides:
      primary: 0.0
      backup: 0.0
  - name: baseline_cached
    description: "Default fail rates with the cache ON - paired control for no_cache"
    provider_overrides: {}
    cache_enabled: true
  - name: no_cache
    description: "Control run with the cache disabled — baseline for the cache comparison"
    provider_overrides: {}
    cache_enabled: false
  - name: both_degraded
    description: "Primary dead, backup flaky at 60% — both circuits trip, static fallback must hold"
    provider_overrides:
      primary: 1.0
      backup: 0.6
