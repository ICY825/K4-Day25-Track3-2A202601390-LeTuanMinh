[project]
name = "day10-reliability-agent-lab"
version = "0.1.0"
description = "Production-style skeleton for LLM agent reliability: circuit breakers, caching, metrics, and chaos testing."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "rich>=13.7",
  "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["todo: tests that should pass after students implement TODOs"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint.per-file-ignores]
# The test files below ship with the lab and define the grading contract, so
# they are deliberately left byte-for-byte unmodified. These ignores keep
# `make lint` green without editing them; all first-party code is clean under
# the default rule set.
"tests/test_cache.py" = ["RUF059"]            # intentionally unpacks an unused score
"tests/test_redis_cache.py" = ["BLE001"]      # broad except is the availability probe
"tests/test_todo_requirements.py" = ["F401", "I001", "SIM115"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
